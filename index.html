<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resunex — Create Your CV Free</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Mammoth.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- Google Fonts for Templates -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Merriweather:wght@300;400;700&family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    .font-serif-classic { font-family: 'Merriweather', serif; }
    .font-serif-executive { font-family: 'Playfair Display', serif; }
    .font-mono-tech { font-family: 'Fira Code', monospace; }
    .font-sans-modern { font-family: 'Montserrat', sans-serif; }

    @media print {
      body * { visibility: hidden; }
      #cv-preview-card, #cv-preview-card * { visibility: visible; }
      #cv-preview-card { position: absolute; left: 0; top: 0; width: 100%; border: none !important; shadow: none !important; }
      header, .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 no-print">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button id="backBtn" onclick="handleBack()" class="hidden text-sm font-medium text-slate-500 hover:text-slate-800 border border-slate-200 rounded-lg px-3 py-1.5 transition-all">
          ← Back
        </button>
        <span class="text-xl font-black tracking-tight text-blue-600">Resunex</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="setState({ page: 'upload' })" class="text-sm font-medium text-slate-600 hover:text-slate-900 px-3 py-1.5">Upload CV</button>
        <button onclick="setState({ page: 'preview' })" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-4 py-2 rounded-xl shadow-sm transition-all">
          ⚡ Create CV
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 flex flex-col justify-center">
    <!-- Dynamic Content Rendered Here -->
  </main>

  <!-- Toast Notification Container -->
  <div id="toast" class="fixed bottom-6 right-6 hidden z-50 no-print"></div>

  <!-- JavaScript Logic -->
  <script>
    // ─── CONFIG ───────────────────────────────────────────────
    const API = "/api/claude";
    const MODEL = "gemini-2.5-flash";

    const TEMPLATES = [
      { id: "modern", name: "Modern Blue", desc: "Clean layout with crisp blue accents", tag: "Popular" },
      { id: "classic", name: "Classic Elegant", desc: "Traditional serif typography with divided sections", tag: "Corporate" },
      { id: "minimal", name: "Minimalist", desc: "Monochrome, ample whitespace, high scannability", tag: "Clean" },
      { id: "tech", name: "Tech Developer", desc: "Developer-centric with code font accents", tag: "Engineering" },
      { id: "executive", name: "Executive Suite", desc: "Sophisticated styling with dynamic header banner", tag: "Leadership" },
      { id: "creative", name: "Creative Edge", desc: "Sidebar summary layout with colorful badges", tag: "Creative" }
    ];

    // ─── API HELPERS ──────────────────────────────────────────
    async function callClaudeWithImage(base64, mimeType, prompt, system) {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 4000,
          system,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mimeType, data: base64 } },
              { type: "text", text: prompt }
            ]
          }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `API error ${res.status}`);
      return data.content?.[0]?.text || "";
    }

    async function callClaudeWithText(text, system) {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 4000,
          system,
          messages: [{ role: "user", content: `Parse this resume content into structured JSON:\n\n${text}` }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `API error ${res.status}`);
      return data.content?.[0]?.text || "";
    }

    // ─── ROBUST JSON REPAIR & SANITIZATION ───────────────────
    function repairJsonString(rawStr) {
      if (!rawStr) return "{}";
      let str = rawStr.trim();

      // 1. Strip markdown code fences if present
      str = str.replace(/^```(?:json)?/gi, "").replace(/```$/g, "").trim();

      // 2. Extract JSON payload between first { and last }
      const startIdx = str.indexOf('{');
      const endIdx = str.lastIndexOf('}');
      if (startIdx !== -1 && endIdx !== -1) {
        str = str.substring(startIdx, endIdx + 1);
      }

      // 3. Escape literal unescaped newlines/tabs inside JSON string values
      str = str.replace(/"([^"\\]*(\\.[^"\\]*)*)"/g, (match) => {
        return match
          .replace(/\n/g, "\\n")
          .replace(/\r/g, "\\r")
          .replace(/\t/g, "\\t");
      });

      // 4. Clean control characters and trailing commas
      str = str.replace(/[\u0000-\u001F\u007F-\u009F]/g, " ");
      str = str.replace(/,\s*([}\]])/g, '$1');

      return str;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function fileToArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    async function extractDocxText(file) {
      const arrayBuffer = await fileToArrayBuffer(file);
      const result = await mammoth.extractRawText({ arrayBuffer });
      return result.value || "";
    }

    async function pdfToBase64Image(file) {
      if (typeof pdfjsLib === "undefined") {
        throw new Error("PDF processing library failed to load.");
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const arrayBuffer = await fileToArrayBuffer(file);
      const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = Math.min(pdfDoc.numPages, 3);
      const canvases = [];
      let totalHeight = 0, maxWidth = 0;

      for (let i = 1; i <= totalPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        canvases.push(canvas);
        totalHeight += viewport.height;
        maxWidth = Math.max(maxWidth, viewport.width);
      }

      const merged = document.createElement("canvas");
      merged.width = maxWidth;
      merged.height = totalHeight;
      const ctx = merged.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, maxWidth, totalHeight);

      let y = 0;
      for (const c of canvases) { 
        ctx.drawImage(c, 0, y); 
        y += c.height; 
      }
      return merged.toDataURL("image/jpeg", 0.92).split(",")[1];
    }

    async function extractPdfText(file) {
      if (typeof pdfjsLib === "undefined") {
        throw new Error("PDF processing library failed to load.");
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const arrayBuffer = await fileToArrayBuffer(file);
      const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = Math.min(pdfDoc.numPages, 5);
      let fullText = "";
      for (let i = 1; i <= totalPages; i++) {
        const page = await pdfDoc.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(" ") + "\n";
      }
      return fullText.trim();
    }

    function atsScore(d) {
      let s = 0, t = 0;
      const a = (v, p) => { t += p; if (v) s += p; };
      a(d.personal?.firstName && d.personal?.lastName, 5);
      a(d.personal?.email, 5); 
      a(d.personal?.phone, 5); 
      a(d.personal?.linkedin, 3);
      a(d.summary?.length > 80, 15);
      a(d.experience?.some(e => e.company), 20);
      a(d.experience?.some(e => e.resp?.length > 40), 10);
      a(d.education?.some(e => e.college), 10);
      a(d.skills?.technical?.length > 0, 10);
      a(d.projects?.some(p => p.name), 7);
      a(d.achievements?.awards || d.achievements?.hackathons, 5);
      a(d.skills?.certifications?.length > 0, 5);
      return Math.round((s / t) * 100) || 0;
    }

    function blankData() {
      return {
        personal: { firstName: "", lastName: "", email: "", phone: "", city: "", state: "", country: "", linkedin: "", github: "", portfolio: "" },
        summary: "",
        education: [{ id: 1, college: "", degree: "", spec: "", cgpa: "", from: "", to: "", desc: "" }],
        experience: [{ id: 1, company: "", title: "", type: "Full-time", location: "", from: "", to: "", current: false, resp: "" }],
        projects: [{ id: 1, name: "", desc: "", tech: "", github: "", live: "" }],
        skills: { technical: [], soft: [], languages: [], certifications: [] },
        achievements: { awards: "", hackathons: "", publications: "", patents: "" }
      };
    }

    // ─── STATE MANAGEMENT ────────────────────────────────────────
    let state = {
      page: "landing",
      selectedTemplate: "modern",
      data: blankData(),
      toast: null,
      uploadProgress: null,
      uploadMessage: ""
    };

    function setState(patch) { 
      state = { ...state, ...patch }; 
      render(); 
    }

    function handleBack() {
      if (state.page === "preview") setState({ page: "builder" });
      else if (state.page === "builder" || state.page === "upload") setState({ page: "landing" });
    }

    function updData(path, val) {
      const n = JSON.parse(JSON.stringify(state.data));
      const keys = path.split(".");
      let cur = n;
      for (let i = 0; i < keys.length - 1; i++) {
        if (!cur[keys[i]]) cur[keys[i]] = {};
        cur = cur[keys[i]];
      }
      cur[keys[keys.length - 1]] = val;
      state.data = n; 
      render();
    }

    function addItem(section, itemSchema) {
      const list = [...(state.data[section] || [])];
      list.push({ ...itemSchema, id: Date.now() });
      updData(section, list);
    }

    function removeItem(section, idx) {
      const list = [...(state.data[section] || [])];
      list.splice(idx, 1);
      updData(section, list);
    }

    function updateArrayItem(section, idx, field, val) {
      const list = JSON.parse(JSON.stringify(state.data[section] || []));
      if (list[idx]) {
        list[idx][field] = val;
        updData(section, list);
      }
    }

    let toastTimer = null;
    function showToast(msg, type = "ok") {
      if (toastTimer) clearTimeout(toastTimer);
      state.toast = { msg, type }; 
      render();
      toastTimer = setTimeout(() => { state.toast = null; render(); }, 3500);
    }

    // ─── FILE UPLOAD PROCESSOR ──────────────────────────────────
    async function handleFileUpload(file) {
      if (!file) return;
      setState({ uploadProgress: 20, uploadMessage: "Extracting file content..." });

      const systemPrompt = `You are a strict JSON generator. Extract structured resume details into valid JSON matching the exact schema.
CRITICAL RULES:
1. Return ONLY raw JSON. Do NOT wrap output in markdown code blocks like \`\`\`json.
2. Ensure all array elements and object keys are properly separated by commas.
3. Escape all quote characters inside string values with a backslash.
4. Do not include trailing commas after the last element in arrays or objects.`;

      try {
        let jsonStr = "";
        const fileType = file.name.split('.').pop().toLowerCase();

        if (fileType === "pdf") {
          setState({ uploadProgress: 40, uploadMessage: "Rendering PDF pages..." });
          try {
            const rawText = await extractPdfText(file);
            if (rawText && rawText.length > 100) {
              setState({ uploadProgress: 60, uploadMessage: "Analyzing text structure..." });
              jsonStr = await callClaudeWithText(rawText, systemPrompt);
            } else {
              throw new Error("Text layer empty, switching to OCR...");
            }
          } catch (e) {
            setState({ uploadProgress: 50, uploadMessage: "Processing scanned image..." });
            const base64Img = await pdfToBase64Image(file);
            setState({ uploadProgress: 75, uploadMessage: "AI visual extraction..." });
            jsonStr = await callClaudeWithImage(base64Img, "image/jpeg", "Extract structured JSON from this resume image.", systemPrompt);
          }
        } else if (fileType === "docx") {
          setState({ uploadProgress: 50, uploadMessage: "Extracting Word document..." });
          const text = await extractDocxText(file);
          setState({ uploadProgress: 75, uploadMessage: "Parsing data with AI..." });
          jsonStr = await callClaudeWithText(text, systemPrompt);
        } else if (["jpg", "jpeg", "png", "webp"].includes(fileType)) {
          setState({ uploadProgress: 50, uploadMessage: "Encoding image..." });
          const base64 = await fileToBase64(file);
          const mime = file.type || `image/${fileType}`;
          setState({ uploadProgress: 75, uploadMessage: "Parsing visual data..." });
          jsonStr = await callClaudeWithImage(base64, mime, "Extract JSON from resume image.", systemPrompt);
        } else {
          throw new Error("Unsupported file format.");
        }

        setState({ uploadProgress: 90, uploadMessage: "Structuring resume..." });

        const cleanJsonStr = repairJsonString(jsonStr);
        let parsed = {};
        try {
          parsed = JSON.parse(cleanJsonStr);
        } catch (parseErr) {
          console.error("Raw AI Output:", jsonStr);
          console.error("Cleaned AI Output:", cleanJsonStr);
          throw new Error("Failed to parse resume output. Please try re-uploading.");
        }

        setState({
          data: { ...blankData(), ...parsed },
          page: "builder",
          uploadProgress: null,
          uploadMessage: ""
        });
        showToast("Resume parsed successfully!");

      } catch (err) {
        console.error("Upload error:", err);
        setState({ uploadProgress: null, uploadMessage: `❌ ${err.message}` });
      }
    }

    // ─── TEMPLATE RENDER ENGINES ─────────────────────────────────
    function renderTemplateContent(d, templateId) {
      const fullName = `${d.personal?.firstName || ''} ${d.personal?.lastName || ''}`.trim() || "Your Full Name";
      const techSkills = Array.isArray(d.skills?.technical) ? d.skills.technical : [];
      const softSkills = Array.isArray(d.skills?.soft) ? d.skills.soft : [];
      const certs = Array.isArray(d.skills?.certifications) ? d.skills.certifications : [];

      // 1. MODERN BLUE TEMPLATE
      if (templateId === "modern") {
        return `
          <div class="space-y-6 text-slate-800">
            <div class="border-b-2 border-blue-600 pb-5">
              <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">${fullName}</h1>
              <div class="flex flex-wrap gap-4 text-xs font-medium text-slate-600 mt-2">
                ${d.personal?.email ? `<span>📧 ${d.personal.email}</span>` : ''}
                ${d.personal?.phone ? `<span>📞 ${d.personal.phone}</span>` : ''}
                ${d.personal?.linkedin ? `<span>🔗 ${d.personal.linkedin}</span>` : ''}
                ${d.personal?.github ? `<span>💻 ${d.personal.github}</span>` : ''}
              </div>
            </div>
            ${d.summary ? `
              <div>
                <h2 class="text-sm font-bold uppercase tracking-wider text-blue-600 mb-1">Summary</h2>
                <p class="text-xs text-slate-700 leading-relaxed">${d.summary}</p>
              </div>` : ''}
            ${d.experience?.length ? `
              <div>
                <h2 class="text-sm font-bold uppercase tracking-wider text-blue-600 mb-3">Professional Experience</h2>
                <div class="space-y-4">
                  ${d.experience.map(e => `
                    <div>
                      <div class="flex justify-between items-baseline">
                        <h3 class="font-bold text-slate-900 text-sm">${e.title || ''} ${e.company ? `— <span class="text-slate-700 font-medium">${e.company}</span>` : ''}</h3>
                        <span class="text-xs text-slate-500 font-medium">${e.from || ''} ${e.to ? `- ${e.to}` : ''}</span>
                      </div>
                      ${e.resp ? `<p class="text-xs text-slate-600 mt-1 whitespace-pre-line leading-relaxed">${e.resp}</p>` : ''}
                    </div>`).join('')}
                </div>
              </div>` : ''}
            ${d.education?.length ? `
              <div>
                <h2 class="text-sm font-bold uppercase tracking-wider text-blue-600 mb-2">Education</h2>
                <div class="space-y-2">
                  ${d.education.map(ed => `
                    <div class="flex justify-between">
                      <div>
                        <h3 class="font-bold text-slate-900 text-xs">${ed.college || ''}</h3>
                        <p class="text-xs text-slate-600">${ed.degree || ''} ${ed.spec || ''}</p>
                      </div>
                      <span class="text-xs text-slate-500">${ed.from || ''} - ${ed.to || ''}</span>
                    </div>`).join('')}
                </div>
              </div>` : ''}
            ${d.projects?.length ? `
              <div>
                <h2 class="text-sm font-bold uppercase tracking-wider text-blue-600 mb-2">Key Projects</h2>
                <div class="space-y-2">
                  ${d.projects.map(p => `
                    <div>
                      <div class="flex justify-between">
                        <span class="font-bold text-xs text-slate-900">${p.name || ''}</span>
                        <span class="text-xs text-slate-500 italic">${p.tech || ''}</span>
                      </div>
                      <p class="text-xs text-slate-600 mt-0.5">${p.desc || ''}</p>
                    </div>`).join('')}
                </div>
              </div>` : ''}
            ${(techSkills.length || softSkills.length || certs.length) ? `
              <div>
                <h2 class="text-sm font-bold uppercase tracking-wider text-blue-600 mb-2">Skills & Certifications</h2>
                <div class="text-xs space-y-1 text-slate-700">
                  ${techSkills.length ? `<p><strong>Technical:</strong> ${techSkills.join(', ')}</p>` : ''}
                  ${softSkills.length ? `<p><strong>Soft Skills:</strong> ${softSkills.join(', ')}</p>` : ''}
                  ${certs.length ? `<p><strong>Certifications:</strong> ${certs.join(', ')}</p>` : ''}
                </div>
              </div>` : ''}
          </div>
        `;
      }

      // 2. CLASSIC ELEGANT TEMPLATE
      if (templateId === "classic") {
        return `
          <div class="font-serif-classic space-y-5 text-slate-900">
            <div class="text-center border-b pb-4 border-slate-300">
              <h1 class="text-3xl font-bold uppercase tracking-wider">${fullName}</h1>
              <p class="text-xs text-slate-600 mt-2">
                ${[d.personal?.email, d.personal?.phone, d.personal?.linkedin, d.personal?.github].filter(Boolean).join(' | ')}
              </p>
            </div>
            ${d.summary ? `
              <div>
                <h2 class="text-xs font-bold uppercase border-b border-slate-400 pb-1 mb-2 tracking-widest text-slate-800">Executive Profile</h2>
                <p class="text-xs leading-relaxed text-slate-700 italic">${d.summary}</p>
              </div>` : ''}
            ${d.experience?.length ? `
              <div>
                <h2 class="text-xs font-bold uppercase border-b border-slate-400 pb-1 mb-3 tracking-widest text-slate-800">Professional Experience</h2>
                <div class="space-y-4">
                  ${d.experience.map(e => `
                    <div>
                      <div class="flex justify-between font-bold text-xs">
                        <span>${e.company || ''}</span>
                        <span>${e.from || ''} - ${e.to || ''}</span>
                      </div>
                      <div class="italic text-xs text-slate-700 mb-1">${e.title || ''}</div>
                      <p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed">${e.resp || ''}</p>
                    </div>`).join('')}
                </div>
              </div>` : ''}
            ${d.education?.length ? `
              <div>
                <h2 class="text-xs font-bold uppercase border-b border-slate-400 pb-1 mb-2 tracking-widest text-slate-800">Education</h2>
                ${d.education.map(ed => `
                  <div class="flex justify-between text-xs mb-1">
                    <div><strong>${ed.college}</strong> — ${ed.degree || ''} ${ed.spec || ''}</div>
                    <span>${ed.from || ''} - ${ed.to || ''}</span>
                  </div>`).join('')}
              </div>` : ''}
            ${(techSkills.length || certs.length) ? `
              <div>
                <h2 class="text-xs font-bold uppercase border-b border-slate-400 pb-1 mb-2 tracking-widest text-slate-800">Competencies & Credentials</h2>
                <p class="text-xs text-slate-700">${[...techSkills, ...certs].join(' • ')}</p>
              </div>` : ''}
          </div>
        `;
      }

      // 3. MINIMALIST TEMPLATE
      if (templateId === "minimal") {
        return `
          <div class="space-y-6 text-neutral-800 font-sans">
            <div>
              <h1 class="text-4xl font-light tracking-tight text-black">${fullName}</h1>
              <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-neutral-500 mt-2 border-b border-neutral-200 pb-4">
                ${d.personal?.email ? `<span>${d.personal.email}</span>` : ''}
                ${d.personal?.phone ? `<span>${d.personal.phone}</span>` : ''}
                ${d.personal?.linkedin ? `<span>${d.personal.linkedin}</span>` : ''}
              </div>
            </div>
            ${d.summary ? `<p class="text-xs text-neutral-600 leading-relaxed">${d.summary}</p>` : ''}
            ${d.experience?.length ? `
              <div class="space-y-4">
                <h2 class="text-xs font-semibold tracking-widest text-neutral-400 uppercase">Experience</h2>
                ${d.experience.map(e => `
                  <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                      <span class="font-medium text-black">${e.title}</span>
                      <span class="text-neutral-400">${e.from} – ${e.to}</span>
                    </div>
                    <div class="text-xs text-neutral-500">${e.company}</div>
                    <p class="text-xs text-neutral-600 leading-relaxed whitespace-pre-line">${e.resp}</p>
                  </div>`).join('')}
              </div>` : ''}
            ${d.education?.length ? `
              <div class="space-y-2">
                <h2 class="text-xs font-semibold tracking-widest text-neutral-400 uppercase">Education</h2>
                ${d.education.map(ed => `
                  <div class="flex justify-between text-xs">
                    <span class="text-neutral-800">${ed.college} — ${ed.degree}</span>
                    <span class="text-neutral-400">${ed.from} - ${ed.to}</span>
                  </div>`).join('')}
              </div>` : ''}
            ${techSkills.length ? `
              <div class="space-y-1">
                <h2 class="text-xs font-semibold tracking-widest text-neutral-400 uppercase">Skills</h2>

              <button onclick="setState({ page: 'preview' })" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-base px-8 py-4 rounded-xl shadow-lg transition-all flex items-center gap-2">
                ⚡ Choose Template & Preview CV →
              </button>
            </div>

          </div>
        `;
      } else if (state.page === "preview") {
        const d = state.data;

        app.innerHTML = `
          <div class="max-w-6xl mx-auto w-full space-y-6">
            
            <!-- Top Controls -->
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4 no-print">
              <button onclick="setState({ page: 'builder' })" class="text-sm font-medium text-slate-600 hover:text-slate-900 border border-slate-200 px-4 py-2 rounded-xl">
                ← Edit Details
              </button>
              <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-6 py-2.5 rounded-xl shadow-sm transition-all flex items-center gap-2">
                  📥 Download PDF
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
              
              <!-- Template Picker Sidebar -->
              <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4 no-print col-span-1">
                <h3 class="font-bold text-slate-900 border-b pb-2 text-base">🎨 Choose Template</h3>
                <div class="space-y-3">
                  ${TEMPLATES.map(t => `
                    <div 
                      onclick="setState({ selectedTemplate: '${t.id}' })" 
                      class="p-3.5 rounded-xl border-2 transition-all cursor-pointer flex justify-between items-center ${
                        state.selectedTemplate === t.id 
                          ? 'border-blue-600 bg-blue-50/50 shadow-sm' 
                          : 'border-slate-100 hover:border-slate-300 bg-slate-50/30'
                      }"
                    >
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="font-bold text-sm ${state.selectedTemplate === t.id ? 'text-blue-700' : 'text-slate-800'}">${t.name}</span>
                          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${state.selectedTemplate === t.id ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-600'}">${t.tag}</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-0.5">${t.desc}</p>
                      </div>
                      ${state.selectedTemplate === t.id ? '<span class="text-blue-600 font-bold">✓</span>' : ''}
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Live Resume Render Card -->
              <div class="lg:col-span-2">
                <div id="cv-preview-card" class="bg-white border border-slate-200 shadow-md rounded-2xl p-10 min-h-[900px] overflow-hidden">
                  ${renderTemplateContent(d, state.selectedTemplate)}
                </div>
              </div>

            </div>

          </div>
        `;
      }
    }

    // Initial Render
    render();
  </script>
</body>
</html>
