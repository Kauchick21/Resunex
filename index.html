// ─── CONFIG ───────────────────────────────────────────────
const API = "/api/claude";
const MODEL = "claude-sonnet-4-6";

// ─── HELPERS ─────────────────────────────────────────────
async function callClaude(messages, system, maxTokens = 1500) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, system, messages })
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  return data.content?.[0]?.text || "";
}

async function callClaudeWithImage(base64, mimeType, prompt, system) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 2000,
      system,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mimeType, data: base64 } },
          { type: "text", text: prompt }
        ]
      }]
    })
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  return data.content?.[0]?.text || "";
}

async function callClaudeWithText(text, system) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 2000,
      system,
      messages: [{ role: "user", content: `Here is the full text extracted from a resume. Parse it into structured JSON:\n\n${text}` }]
    })
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  return data.content?.[0]?.text || "";
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

// Extract text from DOCX using mammoth
async function extractDocxText(file) {
  const arrayBuffer = await fileToArrayBuffer(file);
  const result = await mammoth.extractRawText({ arrayBuffer });
  return result.value || "";
}

// Render first page of PDF to a base64 image using PDF.js
async function pdfToBase64Image(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const arrayBuffer = await fileToArrayBuffer(file);
  const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  // Render up to first 3 pages and stitch them
  const totalPages = Math.min(pdfDoc.numPages, 3);
  const canvases = [];
  let totalHeight = 0, maxWidth = 0;
  for (let i = 1; i <= totalPages; i++) {
    const page = await pdfDoc.getPage(i);
    const viewport = page.getViewport({ scale: 2.0 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    canvases.push(canvas);
    totalHeight += viewport.height;
    maxWidth = Math.max(maxWidth, viewport.width);
  }
  // Merge canvases vertically
  const merged = document.createElement("canvas");
  merged.width = maxWidth;
  merged.height = totalHeight;
  const ctx = merged.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, maxWidth, totalHeight);
  let y = 0;
  for (const c of canvases) { ctx.drawImage(c, 0, y); y += c.height; }
  return merged.toDataURL("image/jpeg", 0.92).split(",")[1];
}

// Also extract text from PDF using PDF.js for better accuracy
async function extractPdfText(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const arrayBuffer = await fileToArrayBuffer(file);
  const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const totalPages = Math.min(pdfDoc.numPages, 5);
  let fullText = "";
  for (let i = 1; i <= totalPages; i++) {
    const page = await pdfDoc.getPage(i);
    const content = await page.getTextContent();
    fullText += content.items.map(item => item.str).join(" ") + "\n";
  }
  return fullText.trim();
}

function atsScore(d) {
  let s = 0, t = 0;
  const a = (v, p) => { t += p; if (v) s += p; };
  a(d.personal.firstName && d.personal.lastName, 5);
  a(d.personal.email, 5); a(d.personal.phone, 5); a(d.personal.linkedin, 3);
  a(d.summary?.length > 80, 15);
  a(d.experience?.some(e => e.company), 20);
  a(d.experience?.some(e => e.resp?.length > 40), 10);
  a(d.education?.some(e => e.college), 10);
  a(d.skills?.technical?.length > 2, 10);
  a(d.projects?.some(p => p.name), 7);
  a(d.achievements?.awards || d.achievements?.hackathons, 5);
  a(d.skills?.certifications?.length > 0, 5);
  return Math.round((s / t) * 100);
}

function blankData() {
  return {
    personal: { firstName: "", lastName: "", email: "", phone: "", city: "", state: "", country: "", linkedin: "", github: "", portfolio: "" },
    summary: "",
    education: [{ id: 1, college: "", degree: "", spec: "", cgpa: "", from: "", to: "", desc: "" }],
    experience: [{ id: 1, company: "", title: "", type: "Full-time", location: "", from: "", to: "", current: false, resp: "" }],
    projects: [{ id: 1, name: "", desc: "", tech: "", github: "", live: "" }],
    skills: { technical: [], soft: [], languages: [], certifications: [] },
    achievements: { awards: "", hackathons: "", publications: "", patents: "" },
    template: "minimal"
  };
}

// ─── STATE ────────────────────────────────────────────────
let state = {
  page: "landing", // landing | upload | builder
  step: 0,
  data: blankData(),
  aiLoading: {},
  toast: null,
  preview: false,
  uploadProgress: null, // null | "reading" | "scanning" | "done" | "error"
  uploadMessage: ""
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

function setData(newData) {
  state.data = newData;
  render();
}

function updData(path, val) {
  const n = JSON.parse(JSON.stringify(state.data));
  const keys = path.split(".");
  let cur = n;
  for (let i = 0; i < keys.length - 1; i++) cur = cur[keys[i]];
  cur[keys[keys.length - 1]] = val;
  state.data = n;
  render();
}

let toastTimer = null;
function showToast(msg, type = "ok") {
  if (toastTimer) clearTimeout(toastTimer);
  state.toast = { msg, type };
  render();
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 3500);
}

function inp(id, val, placeholder = "", type = "text", disabled = false) {
  return `<input id="${id}" type="${type}" value="${(val || "").replace(/"/g, '&quot;')}" placeholder="${placeholder}" ${disabled ? "disabled" : ""} style="width:100%">`;
}

function sel(id, val, options) {
  return `<select id="${id}" style="width:100%">${options.map(o => `<option value="${o}" ${val === o ? "selected" : ""}>${o}</option>`).join("")}</select>`;

function ta(id, val, placeholder, minH = 80) {
  return `<textarea id="${id}" placeholder="${placeholder}" style="min-height:${minH}px;width:100%">${(val || "").replace(/</g, "&lt;")}</textarea>`;
}

const RESUME_PARSE_SYSTEM = `You are an expert resume parser. Extract ALL information from the resume and return ONLY a valid JSON object with this exact structure, no other text, no markdown backticks:
{
  "personal": { "firstName": "", "lastName": "", "email": "", "phone": "", "city": "", "state": "", "country": "", "linkedin": "", "github": "", "portfolio": "" },
  "summary": "",
  "education": [{ "id": 1, "college": "", "degree": "", "spec": "", "cgpa": "", "from": "", "to": "", "desc": "" }],
  "experience": [{ "id": 1, "company": "", "title": "", "type": "Full-time", "location": "", "from": "", "to": "", "current": false, "resp": "" }],
  "projects": [{ "id": 1, "name": "", "desc": "", "tech": "", "github": "", "live": "" }],
  "skills": { "technical": [], "soft": [], "languages": [], "certifications": [] },
  "achievements": { "awards": "", "hackathons": "", "publications": "", "patents": "" },
  "template": "minimal"
}
Rules: Fill every field you find. For dates use YYYY-MM format. If a section is missing keep default empty structure. For experience "type" use one of: Full-time, Part-time, Internship, Contract, Freelance. Return ONLY the JSON object.`;

function parseClaudeJSON(raw) {
  const clean = raw.replace(/```json|```/gi, "").trim();
  try { return JSON.parse(clean); } catch {
    const match = clean.match(/\{[\s\S]*\}/);
    if (match) return JSON.parse(match[0]);
    throw new Error("Could not parse JSON");
  }
}

function finalizeData(parsed) {
  const base = blankData();
  const merged = { ...base, ...parsed };
  // Ensure arrays and IDs
  if (!Array.isArray(merged.education) || !merged.education.length) merged.education = base.education;
  if (!Array.isArray(merged.experience) || !merged.experience.length) merged.experience = base.experience;
  if (!Array.isArray(merged.projects) || !merged.projects.length) merged.projects = base.projects;
  merged.education = merged.education.map((e, i) => ({ ...e, id: i + 1 }));
  merged.experience = merged.experience.map((e, i) => ({ ...e, id: i + 1 }));
  merged.projects = merged.projects.map((p, i) => ({ ...p, id: i + 1 }));
  if (!merged.skills || typeof merged.skills !== "object") merged.skills = base.skills;
  merged.skills = { technical: [], soft: [], languages: [], certifications: [], ...merged.skills };
  if (!merged.achievements || typeof merged.achievements !== "object") merged.achievements = base.achievements;
  merged.template = "minimal";
  return merged;
}

async function handleFileUpload(file) {
  if (!file) return;

  const name = file.name.toLowerCase();
  const type = file.type.toLowerCase();

  const isImage = type.startsWith("image/");
  const isPDF = type === "application/pdf" || name.endsWith(".pdf");
  const isDocx = type.includes("wordprocessingml") || type === "application/msword" || name.endsWith(".docx") || name.endsWith(".doc");

  if (!isImage && !isPDF && !isDocx) {
    setState({ uploadProgress: "error", uploadMessage: "Unsupported file type. Please upload a PDF, Word document (.docx), or image (JPG/PNG/WEBP)." });
    return;
  }

  setState({ uploadProgress: "reading", uploadMessage: "" });

  try {
    let result = "";

    if (isImage) {
      // ── IMAGE: send directly to Claude vision ──
      setState({ uploadProgress: "scanning" });
      const base64 = await fileToBase64(file);
      result = await callClaudeWithImage(base64, file.type, "Extract all resume information from this image and return it as structured JSON.", RESUME_PARSE_SYSTEM);

    } else if (isPDF) {
      // ── PDF: extract text first, then optionally render to image ──
      setState({ uploadProgress: "reading" });
      let pdfText = "";
      try { pdfText = await extractPdfText(file); } catch(e) { console.warn("PDF text extract failed:", e); }

      setState({ uploadProgress: "scanning" });

      if (pdfText && pdfText.length > 100) {
        // Use text path — more accurate
        result = await callClaudeWithText(pdfText, RESUME_PARSE_SYSTEM);
      } else {
        // Fallback: render PDF to image
        const base64 = await pdfToBase64Image(file);
        result = await callClaudeWithImage(base64, "image/jpeg", "Extract all resume information from this rendered PDF image and return it as structured JSON.", RESUME_PARSE_SYSTEM);
      }

    } else if (isDocx) {
      // ── DOCX: extract text via mammoth ──
      setState({ uploadProgress: "reading" });
      let docText = "";
      try { docText = await extractDocxText(file); } catch(e) { throw new Error("Could not read Word document. Make sure it's a .docx file."); }
      if (!docText || docText.length < 30) throw new Error("Word document appears empty or unreadable.");

      setState({ uploadProgress: "scanning" });
      result = await callClaudeWithText(docText, RESUME_PARSE_SYSTEM);
    }

    const parsed = parseClaudeJSON(result);
    state.data = finalizeData(parsed);
    setState({ uploadProgress: "done" });

  } catch (err) {
    console.error("Upload error:", err);
    setState({ uploadProgress: "error", uploadMessage: err.message || "Scanning failed. Check your connection and try again." });
  }
}

function collectFormData() {
  const d = state.data;
  const g = id => { const el = document.getElementById(id); return el ? el.value : ""; };

  // Personal
  ["firstName","lastName","email","phone","city","state","country","linkedin","github","portfolio"].forEach(k => {
    const v = g(`p-${k}`); if (v !== null && v !== undefined) d.personal[k] = v;
  });

  // Summary
  const sumEl = document.getElementById("sum-text");
  if (sumEl) d.summary = sumEl.value;

  // Education
  d.education.forEach(e => {
    ["college","degree","spec","cgpa","from","to","desc"].forEach(k => {
      const v = g(`edu-${k}-${e.id}`); if (v !== null && v !== undefined) e[k] = v;
    });
  });

  // Experience
  d.experience.forEach(e => {
    ["company","title","type","location"].forEach(k => {
      const v = g(`exp-${k}-${e.id}`); if (v !== null && v !== undefined) e[k] = v;
    });
    const fromEl = document.getElementById(`exp-from-${e.id}`);
    if (fromEl) e.from = fromEl.value;
    const curEl = document.getElementById(`exp-cur-${e.id}`);
    if (curEl) e.current = curEl.checked;
    if (!e.current) { const toEl = document.getElementById(`exp-to-${e.id}`); if (toEl) e.to = toEl.value; }
    const respEl = document.getElementById(`exp-resp-${e.id}`);
    if (respEl) e.resp = respEl.value;
  });

  // Projects
  d.projects.forEach(p => {
    ["name","tech","github","live"].forEach(k => {
      const v = g(`proj-${k}-${p.id}`); if (v !== null && v !== undefined) p[k] = v;
    });
    const descEl = document.getElementById(`proj-desc-${p.id}`); if (descEl) p.desc = descEl.value;
  });

  // Skills — chips handled separately, just leave as-is

  // Achievements
  ["awards","hackathons","publications","patents"].forEach(k => {
    const el = document.getElementById(`ach-${k}`); if (el) d.achievements[k] = el.value;
  });

  // Summary level/industry
  const lvl = document.getElementById("sum-level"); if (lvl) state.sumLevel = lvl.value;
  const ind = document.getElementById("sum-industry"); if (ind) state.sumIndustry = ind.value;
}

  if (prev) prev.onclick = () => { collectFormData(); setState({ step: Math.max(0, state.step - 1) }); };

  const next = document.getElementById("btn-next");
  if (next) next.onclick = () => { collectFormData(); setState({ step: Math.min(STEPS.length - 1, state.step + 1) }); };

  // Step tabs
  document.querySelectorAll(".step-btn").forEach(b => {
    b.onclick = () => { collectFormData(); setState({ step: parseInt(b.dataset.step) }); };
  });

  // Preview toggle
  const prevBtn = document.getElementById("btn-toggle-preview");
  if (prevBtn) prevBtn.onclick = () => { collectFormData(); setState({ preview: !state.preview }); };

  // Download
  ["btn-download","btn-download2"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onclick = () => { collectFormData(); downloadPDF(); };
  });

  // Template pick
  document.querySelectorAll(".template-pick").forEach(el => {
    el.onclick = () => { collectFormData(); updData("template", el.dataset.tmpl); };
  });

  // Summary mode toggles
  const sm = document.getElementById("sum-mode-manual");
  const sa = document.getElementById("sum-mode-ai");
  if (sm) sm.onclick = () => setState({ summaryMode: "manual" });
  if (sa) sa.onclick = () => setState({ summaryMode: "ai" });

  // Keyword toggle
  document.querySelectorAll(".kw-btn").forEach(b => {
    b.onclick = () => {
      const kw = b.dataset.kw;
      const cur = state.sumKeywords || [];
      state.sumKeywords = cur.includes(kw) ? cur.filter(x => x !== kw) : [...cur, kw];
      render();
    };
  });

  // Generate summary
  const genBtn = document.getElementById("btn-gen-sum");
  if (genBtn) genBtn.onclick = async () => {
    collectFormData();
    state.aiLoading.genSum = true; render();
    try {
      const level = state.sumLevel || "1–3 years";
      const industry = state.sumIndustry || "Software Engineering";
      const kw = (state.sumKeywords || []).join(", ") || "general";
      const result = await callClaude(
        [{ role: "user", content: `Write a 3-sentence ATS-optimized professional summary for a ${level} ${industry} professional. Keywords to include: ${kw}. Use action verbs, first person, results-focused. No preamble, just the summary.` }],
        "You are an expert ATS resume writer."
      );
      state.data.summary = result;
    } catch { showToast("AI failed. Check your internet connection.", "err"); }
    state.aiLoading.genSum = false; render();
  };

  // Enhance summary
  const enhBtn = document.getElementById("btn-enh-sum");
  if (enhBtn) enhBtn.onclick = async () => {
    collectFormData();
    const sumEl = document.getElementById("sum-text");
    const currentSum = sumEl ? sumEl.value : state.data.summary;
    if (!currentSum) { showToast("Write a summary first", "err"); return; }
    state.aiLoading.enhSum = true; render();
    try {
      const result = await callClaude(
        [{ role: "user", content: `Improve this resume summary for ATS. Stronger action verbs, quantified outcomes, 3–4 sentences:\n${currentSum}` }],
        "You are an expert ATS resume writer. Return only the improved text."
      );
      state.data.summary = result;
    } catch { showToast("AI failed. Check your internet connection.", "err"); }
    state.aiLoading.enhSum = false; render();
  };

  // Experience AI enhance
  state.data.experience.forEach(e => {
    const aiBtn = document.getElementById(`btn-exp-ai-${e.id}`);
    if (aiBtn) aiBtn.onclick = async () => {
      collectFormData();
      const respEl = document.getElementById(`exp-resp-${e.id}`);
      const text = respEl ? respEl.value : e.resp;
      if (!text) { showToast("Write responsibilities first", "err"); return; }
      state.aiLoading[`expAI-${e.id}`] = true; render();
      try {
        const result = await callClaude(
          [{ role: "user", content: `Improve these job responsibilities for an ATS resume. Use strong action verbs, add quantified results where possible. Return as clear bullet points or paragraph:\n${text}` }],
          "You are an expert ATS resume writer. Return only the improved text."
        );
        state.data.experience = state.data.experience.map(ex => ex.id === e.id ? { ...ex, resp: result } : ex);
      } catch { showToast("AI failed. Check your internet connection.", "err"); }
      state.aiLoading[`expAI-${e.id}`] = false; render();
    };
  });

  // Add education
  const addEdu = document.getElementById("btn-add-edu");
  if (addEdu) addEdu.onclick = () => {
    collectFormData();
    state.data.education.push({ id: Date.now(), college: "", degree: "", spec: "", cgpa: "", from: "", to: "", desc: "" });
    render();
  };

  // Delete education
  state.data.education.forEach(e => {
    const del = document.getElementById(`btn-del-edu-${e.id}`);
    if (del) del.onclick = () => { collectFormData(); state.data.education = state.data.education.filter(x => x.id !== e.id); render(); };
  });

  // Add experience
  const addExp = document.getElementById("btn-add-exp");
  if (addExp) addExp.onclick = () => {
    collectFormData();
    state.data.experience.push({ id: Date.now(), company: "", title: "", type: "Full-time", location: "", from: "", to: "", current: false, resp: "" });
    render();
  };

  // Delete experience
  state.data.experience.forEach(e => {
    const del = document.getElementById(`btn-del-exp-${e.id}`);
    if (del) del.onclick = () => { collectFormData(); state.data.experience = state.data.experience.filter(x => x.id !== e.id); render(); };
  });

  // Add project
  const addProj = document.getElementById("btn-add-proj");
  if (addProj) addProj.onclick = () => {
    collectFormData();
    state.data.projects.push({ id: Date.now(), name: "", desc: "", tech: "", github: "", live: "" });
    render();
  };

  // Delete project
  state.data.projects.forEach(p => {
    const del = document.getElementById(`btn-del-proj-${p.id}`);
    if (del) del.onclick = () => { collectFormData(); state.data.projects = state.data.projects.filter(x => x.id !== p.id); render(); };
  });

  // Skills preset
  document.querySelectorAll(".skill-preset").forEach(b => {
    b.onclick = () => {
      collectFormData();
      const { cat, skill } = b.dataset;
      const cur = state.data.skills[cat] || [];
      state.data.skills[cat] = cur.includes(skill) ? cur.filter(x => x !== skill) : [...cur, skill];
      render();
    };
  });

  // Skills add
  ["technical","soft","languages","certifications"].forEach(cat => {
    const addBtn = document.getElementById(`btn-add-skill-${cat}`);
    const inp = document.getElementById(`skill-inp-${cat}`);
    const doAdd = () => {
      if (!inp || !inp.value.trim()) return;
      collectFormData();
      state.data.skills[cat] = [...(state.data.skills[cat] || []), inp.value.trim()];
      render();
    };
    if (addBtn) addBtn.onclick = doAdd;
    if (inp) inp.onkeydown = e => { if (e.key === "Enter") doAdd(); };
  });

  // Skills remove
  document.querySelectorAll(".skill-remove").forEach(b => {
    b.onclick = () => {
      collectFormData();
      const { cat, skill } = b.dataset;
      state.data.skills[cat] = (state.data.skills[cat] || []).filter(x => x !== skill);
      render();
    };
  });

  // Live sync for summary char count
  const sumTa = document.getElementById("sum-text");
  if (sumTa) sumTa.oninput = () => {
    state.data.summary = sumTa.value;
    const hint = sumTa.parentElement?.nextElementSibling;
    if (hint && hint.tagName === "P") hint.textContent = `${sumTa.value.length} chars · aim for 150–250`;
  };
}

function downloadPDF() {
  collectFormData();
  const d = state.data;
  const ResumeHTML = (RESUME_MAP[d.template] || resumeMinimal)(d);
  const w = window.open("", "_blank", "width=900,height=700");
  if (!w) { showToast("Allow popups to download PDF", "err"); return; }
  w.document.write(`<!DOCTYPE html><html><head><title>Resume – ${d.personal.firstName} ${d.personal.lastName}</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{margin:0}@page{margin:0;size:A4}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>
  </head><body>${ResumeHTML}</body></html>`);
  w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 700);
  showToast("PDF ready! Choose 'Save as PDF' in the print dialog.");
}

// ─── BOOT ─────────────────────────────────────────────────
render();
</script>
</body>
</html>
