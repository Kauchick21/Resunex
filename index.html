<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resunex — Modern AI Resume Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Fira+Code:wght@400;500&family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Mammoth.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- html2pdf.js CDN (Direct PDF Download) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Merriweather', 'serif'],
            mono: ['Fira Code', 'monospace'],
            outfit: ['Outfit', 'sans-serif'],
            playfair: ['Playfair Display', 'serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <style>
    @media print {
      @page { margin: 0; }
      body { margin: 1.5cm; background: #fff !important; }
      body * { visibility: hidden; }
      #cv-preview-card, #cv-preview-card * { visibility: visible; }
      #cv-preview-card { position: absolute; left: 0; top: 0; width: 100%; border: none !important; box-shadow: none !important; }
      header, .no-print { display: none !important; }
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .subtle-grid {
      background-size: 30px 30px;
      background-image: radial-gradient(circle, rgba(203, 213, 225, 0.4) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-slate-900/5 bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased subtle-grid selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-50 no-print transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="backBtn" onclick="handleBack()" class="hidden text-xs font-semibold text-slate-600 hover:text-slate-900 border border-slate-200 hover:border-slate-300 rounded-xl px-3 py-2 transition-all flex items-center gap-1.5 bg-white shadow-xs">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Back
        </button>
        <span onclick="setState({ page: 'landing' })" class="text-xl font-display font-extrabold tracking-tight bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent cursor-pointer flex items-center gap-2">
          <span class="p-1.5 bg-brand-600 text-white rounded-lg inline-flex items-center justify-center shadow-sm text-xs">R</span>
          Resunex
        </span>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="accessAdmin()" class="text-xs font-semibold text-slate-700 hover:text-slate-900 px-3.5 py-2 border border-slate-200/80 hover:border-slate-300 rounded-xl bg-white shadow-xs hover:shadow-sm transition-all flex items-center gap-2">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          Analytics Hub
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col justify-center">
    <!-- Dynamic Content Rendered Here -->
  </main>

  <!-- Toast Notification Container -->
  <div id="toast" class="fixed bottom-6 right-6 hidden z-50 no-print transition-all duration-300 transform translate-y-0"></div>

  <!-- JavaScript Logic -->
  <script>
    // ─── CONFIG ───────────────────────────────────────────────
    const API = "/api/claude";
    const MODEL = "gemini-2.5-flash";
    const ANALYTICS_ENDPOINT = "/api/analytics/track-download"; 
    const ADMIN_PASSWORD = "admin123";

    // ─── ADMIN SECURITY FUNCTION ──────────────────────────────
    function accessAdmin() {
      if (sessionStorage.getItem('admin_authenticated') === 'true') {
        setState({ page: 'admin' });
        return;
      }

      const pass = prompt("🔐 Enter Admin Password:");
      if (pass === ADMIN_PASSWORD) {
        sessionStorage.setItem('admin_authenticated', 'true');
        setState({ page: 'admin' });
        showToast("Authenticated successfully!", "ok");
      } else if (pass !== null) {
        showToast("Incorrect password!", "err");
      }
    }

    function lockAdmin() {
      sessionStorage.removeItem('admin_authenticated');
      setState({ page: 'landing' });
      showToast("Admin session locked.", "ok");
    }

    // ─── INSIGHTS TRACKING FUNCTION ─────────────────────────
    async function trackDownloadInsight(payload) {
      const logs = JSON.parse(localStorage.getItem('cv_download_logs') || '[]');
      logs.unshift(payload);
      localStorage.setItem('cv_download_logs', JSON.stringify(logs));

      try {
        await fetch(ANALYTICS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (error) {
        console.warn("Server analytics endpoint unavailable, saved locally.");
      }
    }

    // ─── DIRECT PDF DOWNLOAD FUNCTION ─────────────────────────
    async function downloadPDF() {
      const element = document.getElementById('cv-preview-card');
      const firstName = state.data?.personal?.firstName || 'Resume';
      const lastName = state.data?.personal?.lastName || '';
      const email = state.data?.personal?.email || 'N/A';
      const filename = `${firstName}_${lastName}_CV_${state.selectedTemplate}.pdf`.replace(/\s+/g, '_');

      showToast("Generating PDF download...", "ok");

      trackDownloadInsight({
        id: Date.now(),
        userName: `${firstName} ${lastName}`.trim() || 'Anonymous User',
        userEmail: email,
        timestamp: new Date().toLocaleString(),
        filename: filename,
        userAgent: navigator.userAgent
      });

      const opt = {
        margin:       [10, 10, 10, 10],
        filename:     filename,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        showToast("PDF Downloaded successfully!");
      }).catch(err => {
        console.error("PDF Download error:", err);
        showToast("Failed to generate PDF download", "err");
      });
    }

    // ─── API HELPERS ──────────────────────────────────────────
    async function callClaudeWithImage(base64, mimeType, prompt, system) {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 4000,
          system,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mimeType, data: base64 } },
              { type: "text", text: prompt }
            ]
          }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `API error ${res.status}`);
      return data.content?.[0]?.text || "";
    }

    async function callClaudeWithText(text, system) {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 4000,
          system,
          messages: [{ role: "user", content: `Parse this resume content into structured JSON:\n\n${text}` }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `API error ${res.status}`);
      return data.content?.[0]?.text || "";
    }

    // ─── ROBUST JSON REPAIR & SANITIZATION ───────────────────
    function repairJsonString(rawStr) {
      if (!rawStr) return "{}";
      let str = rawStr.trim();
      const startIdx = str.indexOf('{');
      const endIdx = str.lastIndexOf('}');
      if (startIdx !== -1 && endIdx !== -1) {
        str = str.substring(startIdx, endIdx + 1);
      }
      str = str.replace(/"([^"\\]*(\\.[^"\\]*)*)"/g, (match) => {
        return match
          .replace(/\n/g, "\\n")
          .replace(/\r/g, "\\r")
          .replace(/\t/g, "\\t");
      });
      str = str.replace(/[\u0000-\u001F\u007F-\u009F]/g, " ");
      str = str.replace(/,\s*([}\]])/g, '$1');
      return str;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function fileToArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    async function extractDocxText(file) {
      const arrayBuffer = await fileToArrayBuffer(file);
      const result = await mammoth.extractRawText({ arrayBuffer });
      return result.value || "";
    }

    async function pdfToBase64Image(file) {
      if (typeof pdfjsLib === "undefined") {
        throw new Error("PDF processing library failed to load.");
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const arrayBuffer = await fileToArrayBuffer(file);
      const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = Math.min(pdfDoc.numPages, 3);
      const canvases = [];
      let totalHeight = 0, maxWidth = 0;

      for (let i = 1; i <= totalPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        canvases.push(canvas);
        totalHeight += viewport.height;
        maxWidth = Math.max(maxWidth, viewport.width);
      }

      const merged = document.createElement("canvas");
      merged.width = maxWidth;
      merged.height = totalHeight;
      const ctx = merged.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, maxWidth, totalHeight);

      let y = 0;
      for (const c of canvases) { 
        ctx.drawImage(c, 0, y); 
        y += c.height; 
      }
      return merged.toDataURL("image/jpeg", 0.92).split(",")[1];
    }

    async function extractPdfText(file) {
      if (typeof pdfjsLib === "undefined") {
        throw new Error("PDF processing library failed to load.");
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const arrayBuffer = await fileToArrayBuffer(file);
      const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = Math.min(pdfDoc.numPages, 5);
      let fullText = "";
      for (let i = 1; i <= totalPages; i++) {
        const page = await pdfDoc.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(" ") + "\n";
      }
      return fullText.trim();
    }

    function atsScore(d) {
      let s = 0, t = 0;
      const a = (v, p) => { t += p; if (v) s += p; };
      a(d.personal?.firstName && d.personal?.lastName, 5);
      a(d.personal?.email, 5); 
      a(d.personal?.phone, 5); 
      a(d.personal?.linkedin, 3);
      a(d.summary?.length > 80, 15);
      a(d.experience?.some(e => e.company), 20);
      a(d.experience?.some(e => e.resp?.length > 40), 10);
      a(d.education?.some(e => e.college), 10);
      a(d.skills?.technical?.length > 0, 10);
      a(d.projects?.some(p => p.name), 7);
      a(d.achievements?.awards || d.achievements?.hackathons, 5);
      a(d.skills?.certifications?.length > 0, 5);
      return Math.round((s / t) * 100) || 0;
    }

    function blankData() {
      return {
        personal: { firstName: "", lastName: "", email: "", phone: "", city: "", state: "", country: "", linkedin: "", github: "", portfolio: "" },
        summary: "",
        education: [{ id: 1, college: "", degree: "", spec: "", cgpa: "", from: "", to: "", desc: "" }],
        experience: [{ id: 1, company: "", title: "", type: "Full-time", location: "", from: "", to: "", current: false, resp: "" }],
        projects: [{ id: 1, name: "", desc: "", tech: "", github: "", live: "" }],
        skills: { technical: [], soft: [], languages: [], certifications: [] },
        achievements: { awards: "", hackathons: "", publications: "", patents: "" }
      };
    }

    // ─── TEMPLATES DATA ──────────────────────────────────────────
    const TEMPLATES = [
      { id: 'modern', name: 'Modern Minimal', tag: 'Popular', icon: '✨' },
      { id: 'executive', name: 'Executive Dark Header', tag: 'Corporate', icon: '💼' },
      { id: 'tech', name: 'Tech / Developer', tag: 'Monospace', icon: '⚡' },
      { id: 'classic', name: 'Classic Serif', tag: 'Traditional', icon: '🏛️' },
      { id: 'sidebar', name: 'Modern Split Sidebar', tag: 'Creative', icon: '📊' },
      { id: 'emerald', name: 'Emerald Elegant', tag: 'Clean', icon: '🌿' },
      { id: 'compact', name: 'Compact ATS', tag: 'Dense', icon: '🎯' }
    ];

    // ─── HELPER FOR PARSING PARAGRAPHS INTO BULLET POINTS ─────────
    function formatBullets(text, customListClass = "list-disc pl-5 space-y-1 mt-1.5 text-[11px] text-slate-600 leading-relaxed") {
      if (!text) return '';
      
      let lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

      // If text is a single paragraph, split sentences into clean bullet points
      if (lines.length === 1) {
        if (lines[0].includes('•') || lines[0].includes(' - ')) {
          lines = lines[0].split(/[•]|\s-\s/).map(l => l.trim()).filter(Boolean);
        } else if (lines[0].split(/(?<=\.)\s+/).length > 1) {
          lines = lines[0].split(/(?<=\.)\s+/).map(l => l.trim()).filter(Boolean);
        }
      }

      // Strip existing bullet markers (*, -, •, numbers)
      const cleaned = lines.map(line => line.replace(/^[\*\-\•\d+\.]\s*/, '').trim()).filter(Boolean);

      if (cleaned.length === 0) return '';

      return `<ul class="${customListClass}">
        ${cleaned.map(l => `<li>${l}</li>`).join('')}
      </ul>`;
    }

    // ─── STATE MANAGEMENT ────────────────────────────────────────
    let state = {
      page: "landing",
      data: blankData(),
      toast: null,
      uploadProgress: null,
      uploadMessage: "",
      adminSearch: "",
      selectedTemplate: "modern"
    };

    function setState(patch) { 
      state = { ...state, ...patch }; 
      render(); 
    }

    function handleBack() {
      if (state.page === "preview") setState({ page: "builder" });
      else if (state.page === "builder" || state.page === "upload" || state.page === "admin") setState({ page: "landing" });
    }

    function updData(path, val) {
      const n = JSON.parse(JSON.stringify(state.data));
      const keys = path.split(".");
      let cur = n;
      for (let i = 0; i < keys.length - 1; i++) {
        if (!cur[keys[i]]) cur[keys[i]] = {};
        cur = cur[keys[i]];
      }
      cur[keys[keys.length - 1]] = val;
      state.data = n; 
      render();
    }

    function addItem(section, itemSchema) {
      const list = [...(state.data[section] || [])];
      list.push({ ...itemSchema, id: Date.now() });
      updData(section, list);
    }

    function removeItem(section, idx) {
      const list = [...(state.data[section] || [])];
      list.splice(idx, 1);
      updData(section, list);
    }

    function updateArrayItem(section, idx, field, val) {
      const list = JSON.parse(JSON.stringify(state.data[section] || []));
      if (list[idx]) {
        list[idx][field] = val;
        updData(section, list);
      }
    }

    function clearLogs() {
      if (confirm("Are you sure you want to clear all analytics logs?")) {
        localStorage.removeItem('cv_download_logs');
        render();
        showToast("Logs cleared successfully!");
      }
    }

    let toastTimer = null;
    function showToast(msg, type = "ok") {
      if (toastTimer) clearTimeout(toastTimer);
      state.toast = { msg, type }; 
      render();
      toastTimer = setTimeout(() => { state.toast = null; render(); }, 3500);
    }

    // ─── FILE UPLOAD PROCESSOR ──────────────────────────────────
    async function handleFileUpload(file) {
      if (!file) return;
      setState({ uploadProgress: 20, uploadMessage: "Extracting file content..." });

      const systemPrompt = "Extract structured resume details into valid JSON matching the exact schema requested.";

      try {
        let jsonStr = "";
        const fileType = file.name.split('.').pop().toLowerCase();

        if (fileType === "pdf") {
          setState({ uploadProgress: 40, uploadMessage: "Rendering PDF pages..." });
          try {
            const rawText = await extractPdfText(file);
            if (rawText && rawText.length > 100) {
              setState({ uploadProgress: 60, uploadMessage: "Analyzing text structure..." });
              jsonStr = await callClaudeWithText(rawText, systemPrompt);
            } else {
              throw new Error("Text layer empty, switching to OCR...");
            }
          } catch (e) {
            setState({ uploadProgress: 50, uploadMessage: "Processing scanned image..." });
            const base64Img = await pdfToBase64Image(file);
            setState({ uploadProgress: 75, uploadMessage: "AI visual extraction..." });
            jsonStr = await callClaudeWithImage(base64Img, "image/jpeg", "Extract structured JSON from this resume image.", systemPrompt);
          }
        } else if (fileType === "docx") {
          setState({ uploadProgress: 50, uploadMessage: "Extracting Word document..." });
          const text = await extractDocxText(file);
          setState({ uploadProgress: 75, uploadMessage: "Parsing data with AI..." });
          jsonStr = await callClaudeWithText(text, systemPrompt);
        } else if (["jpg", "jpeg", "png", "webp"].includes(fileType)) {
          setState({ uploadProgress: 50, uploadMessage: "Encoding image..." });
          const base64 = await fileToBase64(file);
          const mime = file.type || `image/${fileType}`;
          setState({ uploadProgress: 75, uploadMessage: "Parsing visual data..." });
          jsonStr = await callClaudeWithImage(base64, mime, "Extract JSON from resume image.", systemPrompt);
        } else {
          throw new Error("Unsupported file format.");
        }

        setState({ uploadProgress: 90, uploadMessage: "Structuring resume..." });

        const cleanJsonStr = repairJsonString(jsonStr);
        const parsed = JSON.parse(cleanJsonStr);

        setState({
          data: { ...blankData(), ...parsed },
          page: "builder",
          uploadProgress: null,
          uploadMessage: ""
        });
        showToast("Resume parsed successfully!");

      } catch (err) {
        console.error("Upload error:", err);
        setState({ uploadProgress: null, uploadMessage: `❌ ${err.message}` });
      }
    }

    // ─── TEMPLATE RENDERERS ──────────────────────────────────────
    function renderTemplateContent(templateId, d) {
      const fullName = `${d.personal?.firstName || ''} ${d.personal?.lastName || ''}`.trim() || "Your Name";
      const techSkills = Array.isArray(d.skills?.technical) ? d.skills.technical : [];
      const softSkills = Array.isArray(d.skills?.soft) ? d.skills.soft : [];
      const certs = Array.isArray(d.skills?.certifications) ? d.skills.certifications : [];

      // 1. Modern Minimal (Original Clean)
      if (templateId === 'modern') {
        return `
          <div class="space-y-6 font-sans text-slate-800">
            <div class="border-b border-slate-200 pb-6 text-center">
              <h1 class="text-3xl font-display font-extrabold text-slate-900 tracking-tight">${fullName}</h1>
              <div class="flex flex-wrap items-center justify-center gap-3 text-xs text-slate-600 mt-2">
                ${d.personal?.email ? `<span>📧 ${d.personal.email}</span>` : ''}
                ${d.personal?.phone ? `<span>📞 ${d.personal.phone}</span>` : ''}
                ${d.personal?.linkedin ? `<span>🔗 ${d.personal.linkedin}</span>` : ''}
                ${d.personal?.github ? `<span>💻 ${d.personal.github}</span>` : ''}
              </div>
            </div>
            ${d.summary ? `<div class="space-y-1.5"><h2 class="text-xs font-bold uppercase tracking-wider text-brand-600">Professional Summary</h2><p class="text-xs text-slate-700 leading-relaxed">${d.summary}</p></div>` : ''}
            ${d.experience?.length ? `<div class="space-y-4"><h2 class="text-xs font-bold uppercase tracking-wider text-brand-600">Work Experience</h2><div class="space-y-4">${d.experience.map(exp => `<div><div class="flex justify-between items-baseline"><h3 class="font-bold text-slate-900 text-xs">${exp.title || 'Role'} ${exp.company ? `— <span class="text-slate-700 font-medium">${exp.company}</span>` : ''}</h3><span class="text-[11px] text-slate-500 font-medium">${exp.from || ''} - ${exp.to || ''}</span></div>${formatBullets(exp.resp, "list-disc pl-5 space-y-1 mt-1 text-[11px] text-slate-600 leading-relaxed")}</div>`).join('')}</div></div>` : ''}
            ${d.education?.length ? `<div class="space-y-2"><h2 class="text-xs font-bold uppercase tracking-wider text-brand-600">Education</h2><div class="space-y-2">${d.education.map(edu => `<div class="flex justify-between items-baseline"><div><h3 class="font-bold text-slate-900 text-xs">${edu.college || 'University'}</h3><p class="text-[11px] text-slate-600">${edu.degree || ''} ${edu.spec || ''}</p></div><span class="text-[11px] text-slate-500">${edu.from || ''} - ${edu.to || ''}</span></div>`).join('')}</div></div>` : ''}
            ${d.projects?.length ? `<div class="space-y-2"><h2 class="text-xs font-bold uppercase tracking-wider text-brand-600">Projects</h2><div class="space-y-2">${d.projects.map(proj => `<div><div class="flex justify-between items-baseline"><h3 class="font-bold text-slate-900 text-xs">${proj.name || 'Project'}</h3>${proj.tech ? `<span class="text-[11px] text-slate-500 italic">${proj.tech}</span>` : ''}</div>${formatBullets(proj.desc, "list-disc pl-5 space-y-1 mt-1 text-[11px] text-slate-600")}</div>`).join('')}</div></div>` : ''}
