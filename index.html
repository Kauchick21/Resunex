<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resunex — Create Your CV Free</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Mammoth.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- html2pdf.js CDN (Direct PDF Download) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @media print {
      @page { margin: 0; }
      body { margin: 1.5cm; }
      body * { visibility: hidden; }
      #cv-preview-card, #cv-preview-card * { visibility: visible; }
      #cv-preview-card { position: absolute; left: 0; top: 0; width: 100%; border: none !important; box-shadow: none !important; }
      header, .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 no-print">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button id="backBtn" onclick="handleBack()" class="hidden text-sm font-medium text-slate-500 hover:text-slate-800 border border-slate-200 rounded-lg px-3 py-1.5 transition-all">
          ← Back
        </button>
        <span class="text-xl font-black tracking-tight text-blue-600 cursor-pointer" onclick="setState({ page: 'landing' })">Resunex</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="accessAdmin()" class="text-sm font-medium text-slate-600 hover:text-slate-900 px-3 py-1.5 border border-slate-200 rounded-lg bg-slate-50">
          📊 Analytics
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 flex flex-col justify-center">
    <!-- Dynamic Content Rendered Here -->
  </main>

  <!-- Toast Notification Container -->
  <div id="toast" class="fixed bottom-6 right-6 hidden z-50 no-print"></div>

  <!-- JavaScript Logic -->
  <script>
    // ─── CONFIG ───────────────────────────────────────────────
    const API = "/api/claude";
    const MODEL = "gemini-2.5-flash";
    const ANALYTICS_ENDPOINT = "/api/analytics/track-download"; 
    const ADMIN_PASSWORD = "admin123"; // Change your admin passcode here

    // ─── ADMIN SECURITY FUNCTION ──────────────────────────────
    function accessAdmin() {
      // Check if session is already authenticated
      if (sessionStorage.getItem('admin_authenticated') === 'true') {
        setState({ page: 'admin' });
        return;
      }

      const pass = prompt("🔐 Enter Admin Password:");
      if (pass === ADMIN_PASSWORD) {
        sessionStorage.setItem('admin_authenticated', 'true');
        setState({ page: 'admin' });
        showToast("Authenticated successfully!", "ok");
      } else if (pass !== null) {
        showToast("Incorrect password!", "err");
      }
    }

    function lockAdmin() {
      sessionStorage.removeItem('admin_authenticated');
      setState({ page: 'landing' });
      showToast("Admin session locked.", "ok");
    }

    // ─── INSIGHTS TRACKING FUNCTION ─────────────────────────
    async function trackDownloadInsight(payload) {
      const logs = JSON.parse(localStorage.getItem('cv_download_logs') || '[]');
      logs.unshift(payload);
      localStorage.setItem('cv_download_logs', JSON.stringify(logs));

      try {
        await fetch(ANALYTICS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (error) {
        console.warn("Server analytics endpoint unavailable, saved locally.");
      }
    }

    // ─── DIRECT PDF DOWNLOAD FUNCTION ─────────────────────────
    async function downloadPDF() {
      const element = document.getElementById('cv-preview-card');
      const firstName = state.data?.personal?.firstName || 'Resume';
      const lastName = state.data?.personal?.lastName || '';
      const email = state.data?.personal?.email || 'N/A';
      const filename = `${firstName}_${lastName}_CV.pdf`.replace(/\s+/g, '_');

      showToast("Generating PDF download...", "ok");

      trackDownloadInsight({
        id: Date.now(),
        userName: `${firstName} ${lastName}`.trim() || 'Anonymous User',
        userEmail: email,
        timestamp: new Date().toLocaleString(),
        filename: filename,
        userAgent: navigator.userAgent
      });

      const opt = {
        margin:       [10, 10, 10, 10],
        filename:     filename,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        showToast("PDF Downloaded successfully!");
      }).catch(err => {
        console.error("PDF Download error:", err);
        showToast("Failed to generate PDF download", "err");
      });
    }

    // ─── API HELPERS ──────────────────────────────────────────
    async function callClaudeWithImage(base64, mimeType, prompt, system) {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 4000,
          system,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mimeType, data: base64 } },
              { type: "text", text: prompt }
            ]
          }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `API error ${res.status}`);
      return data.content?.[0]?.text || "";
    }

    async function callClaudeWithText(text, system) {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 4000,
          system,
          messages: [{ role: "user", content: `Parse this resume content into structured JSON:\n\n${text}` }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `API error ${res.status}`);
      return data.content?.[0]?.text || "";
    }

    // ─── ROBUST JSON REPAIR & SANITIZATION ───────────────────
    function repairJsonString(rawStr) {
      if (!rawStr) return "{}";
      let str = rawStr.trim();
      const startIdx = str.indexOf('{');
      const endIdx = str.lastIndexOf('}');
      if (startIdx !== -1 && endIdx !== -1) {
        str = str.substring(startIdx, endIdx + 1);
      }
      str = str.replace(/"([^"\\]*(\\.[^"\\]*)*)"/g, (match) => {
        return match
          .replace(/\n/g, "\\n")
          .replace(/\r/g, "\\r")
          .replace(/\t/g, "\\t");
      });
      str = str.replace(/[\u0000-\u001F\u007F-\u009F]/g, " ");
      str = str.replace(/,\s*([}\]])/g, '$1');
      return str;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function fileToArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    async function extractDocxText(file) {
      const arrayBuffer = await fileToArrayBuffer(file);
      const result = await mammoth.extractRawText({ arrayBuffer });
      return result.value || "";
    }

    async function pdfToBase64Image(file) {
      if (typeof pdfjsLib === "undefined") {
        throw new Error("PDF processing library failed to load.");
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const arrayBuffer = await fileToArrayBuffer(file);
      const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = Math.min(pdfDoc.numPages, 3);
      const canvases = [];
      let totalHeight = 0, maxWidth = 0;

      for (let i = 1; i <= totalPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        canvases.push(canvas);
        totalHeight += viewport.height;
        maxWidth = Math.max(maxWidth, viewport.width);
      }

      const merged = document.createElement("canvas");
      merged.width = maxWidth;
      merged.height = totalHeight;
      const ctx = merged.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, maxWidth, totalHeight);

      let y = 0;
      for (const c of canvases) { 
        ctx.drawImage(c, 0, y); 
        y += c.height; 
      }
      return merged.toDataURL("image/jpeg", 0.92).split(",")[1];
    }

    async function extractPdfText(file) {
      if (typeof pdfjsLib === "undefined") {
        throw new Error("PDF processing library failed to load.");
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const arrayBuffer = await fileToArrayBuffer(file);
      const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = Math.min(pdfDoc.numPages, 5);
      let fullText = "";
      for (let i = 1; i <= totalPages; i++) {
        const page = await pdfDoc.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(" ") + "\n";
      }
      return fullText.trim();
    }

    function atsScore(d) {
      let s = 0, t = 0;
      const a = (v, p) => { t += p; if (v) s += p; };
      a(d.personal?.firstName && d.personal?.lastName, 5);
      a(d.personal?.email, 5); 
      a(d.personal?.phone, 5); 
      a(d.personal?.linkedin, 3);
      a(d.summary?.length > 80, 15);
      a(d.experience?.some(e => e.company), 20);
      a(d.experience?.some(e => e.resp?.length > 40), 10);
      a(d.education?.some(e => e.college), 10);
      a(d.skills?.technical?.length > 0, 10);
      a(d.projects?.some(p => p.name), 7);
      a(d.achievements?.awards || d.achievements?.hackathons, 5);
      a(d.skills?.certifications?.length > 0, 5);
      return Math.round((s / t) * 100) || 0;
    }

    function blankData() {
      return {
        personal: { firstName: "", lastName: "", email: "", phone: "", city: "", state: "", country: "", linkedin: "", github: "", portfolio: "" },
        summary: "",
        education: [{ id: 1, college: "", degree: "", spec: "", cgpa: "", from: "", to: "", desc: "" }],
        experience: [{ id: 1, company: "", title: "", type: "Full-time", location: "", from: "", to: "", current: false, resp: "" }],
        projects: [{ id: 1, name: "", desc: "", tech: "", github: "", live: "" }],
        skills: { technical: [], soft: [], languages: [], certifications: [] },
        achievements: { awards: "", hackathons: "", publications: "", patents: "" }
      };
    }

    // ─── STATE MANAGEMENT ────────────────────────────────────────
    let state = {
      page: "landing",
      data: blankData(),
      toast: null,
      uploadProgress: null,
      uploadMessage: "",
      adminSearch: ""
    };

    function setState(patch) { 
      state = { ...state, ...patch }; 
      render(); 
    }

    function handleBack() {
      if (state.page === "preview") setState({ page: "builder" });
      else if (state.page === "builder" || state.page === "upload" || state.page === "admin") setState({ page: "landing" });
    }

    function updData(path, val) {
      const n = JSON.parse(JSON.stringify(state.data));
      const keys = path.split(".");
      let cur = n;
      for (let i = 0; i < keys.length - 1; i++) {
        if (!cur[keys[i]]) cur[keys[i]] = {};
        cur = cur[keys[i]];
      }
      cur[keys[keys.length - 1]] = val;
      state.data = n; 
      render();
    }

    function addItem(section, itemSchema) {
      const list = [...(state.data[section] || [])];
      list.push({ ...itemSchema, id: Date.now() });
      updData(section, list);
    }

    function removeItem(section, idx) {
      const list = [...(state.data[section] || [])];
      list.splice(idx, 1);
      updData(section, list);
    }

    function updateArrayItem(section, idx, field, val) {
      const list = JSON.parse(JSON.stringify(state.data[section] || []));
      if (list[idx]) {
        list[idx][field] = val;
        updData(section, list);
      }
    }

    function clearLogs() {
      if (confirm("Are you sure you want to clear all analytics logs?")) {
        localStorage.removeItem('cv_download_logs');
        render();
        showToast("Logs cleared successfully!");
      }
    }

    let toastTimer = null;
    function showToast(msg, type = "ok") {
      if (toastTimer) clearTimeout(toastTimer);
      state.toast = { msg, type }; 
      render();
      toastTimer = setTimeout(() => { state.toast = null; render(); }, 3500);
    }

    // ─── FILE UPLOAD PROCESSOR ──────────────────────────────────
    async function handleFileUpload(file) {
      if (!file) return;
      setState({ uploadProgress: 20, uploadMessage: "Extracting file content..." });

      const systemPrompt = "Extract structured resume details into valid JSON matching the exact schema requested.";

      try {
        let jsonStr = "";
        const fileType = file.name.split('.').pop().toLowerCase();

        if (fileType === "pdf") {
          setState({ uploadProgress: 40, uploadMessage: "Rendering PDF pages..." });
          try {
            const rawText = await extractPdfText(file);
            if (rawText && rawText.length > 100) {
              setState({ uploadProgress: 60, uploadMessage: "Analyzing text structure..." });
              jsonStr = await callClaudeWithText(rawText, systemPrompt);
            } else {
              throw new Error("Text layer empty, switching to OCR...");
            }
          } catch (e) {
            setState({ uploadProgress: 50, uploadMessage: "Processing scanned image..." });
            const base64Img = await pdfToBase64Image(file);
            setState({ uploadProgress: 75, uploadMessage: "AI visual extraction..." });
            jsonStr = await callClaudeWithImage(base64Img, "image/jpeg", "Extract structured JSON from this resume image.", systemPrompt);
          }
        } else if (fileType === "docx") {
          setState({ uploadProgress: 50, uploadMessage: "Extracting Word document..." });
          const text = await extractDocxText(file);
          setState({ uploadProgress: 75, uploadMessage: "Parsing data with AI..." });
          jsonStr = await callClaudeWithText(text, systemPrompt);
        } else if (["jpg", "jpeg", "png", "webp"].includes(fileType)) {
          setState({ uploadProgress: 50, uploadMessage: "Encoding image..." });
          const base64 = await fileToBase64(file);
          const mime = file.type || `image/${fileType}`;
          setState({ uploadProgress: 75, uploadMessage: "Parsing visual data..." });
          jsonStr = await callClaudeWithImage(base64, mime, "Extract JSON from resume image.", systemPrompt);
        } else {
          throw new Error("Unsupported file format.");
        }

        setState({ uploadProgress: 90, uploadMessage: "Structuring resume..." });

        const cleanJsonStr = repairJsonString(jsonStr);
        const parsed = JSON.parse(cleanJsonStr);

        setState({
          data: { ...blankData(), ...parsed },
          page: "builder",
          uploadProgress: null,
          uploadMessage: ""
        });
        showToast("Resume parsed successfully!");

      } catch (err) {
        console.error("Upload error:", err);
        setState({ uploadProgress: null, uploadMessage: `❌ ${err.message}` });
      }
    }

    // ─── RENDER ENGINE ──────────────────────────────────────────
    function render() {
      const app = document.getElementById("app");
      const backBtn = document.getElementById("backBtn");
      
      backBtn.classList.toggle("hidden", state.page === "landing");

      // Toast UI
      const toastEl = document.getElementById("toast");
      if (state.toast) {
        toastEl.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm flex items-center gap-2 ${
          state.toast.type === "ok" ? "bg-emerald-600" : "bg-red-600"
        }`;
        toastEl.innerHTML = state.toast.msg;
        toastEl.classList.remove("hidden");
      } else {
        toastEl.classList.add("hidden");
      }

      // Page Router
      if (state.page === "landing") {
        app.innerHTML = `
          <div class="text-center py-16 max-w-3xl mx-auto space-y-6">
            <span class="bg-blue-50 text-blue-600 text-xs font-semibold px-3 py-1 rounded-full border border-blue-100">✨ Zero fees · No signup · AI-powered</span>
            <h1 class="text-5xl font-extrabold tracking-tight text-slate-900 leading-tight">
              Create your CV in minutes — <span class="text-blue-600">100% free, always.</span>
            </h1>
            <p class="text-slate-600 text-lg">Upload your existing CV to auto-fill, or build from scratch with AI assistance.</p>
            <div class="flex items-center justify-center gap-4 pt-4">
              <button onclick="setState({ page: 'builder' })" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3.5 rounded-xl shadow-md transition-all">
                ⚡ Build My CV — Free
              </button>
              <button onclick="setState({ page: 'upload' })" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold px-6 py-3.5 rounded-xl transition-all">
                📄 Upload & Reformat CV
              </button>
            </div>
          </div>
        `;
      } else if (state.page === "upload") {
        app.innerHTML = `
          <div class="max-w-2xl mx-auto w-full space-y-6">
            <div class="text-center space-y-2">
              <h2 class="text-3xl font-bold text-slate-900">Upload Your CV</h2>
              <p class="text-slate-500 text-sm">Upload your resume and AI will extract all your details automatically.</p>
            </div>

            <div id="dropZone" class="border-2 border-dashed border-blue-200 hover:border-blue-500 bg-blue-50/50 rounded-2xl p-10 text-center transition-all cursor-pointer">
              <input type="file" id="fileInput" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp" class="hidden" onchange="handleFileUpload(this.files[0])"/>
              <div onclick="document.getElementById('fileInput').click()" class="space-y-4">
                <div class="w-16 h-16 bg-white rounded-full shadow-sm mx-auto flex items-center justify-center text-blue-600">☁️</div>
                <div>
                  <p class="font-semibold text-slate-700">Drag & drop your resume here</p>
                  <p class="text-xs text-slate-400 mt-1">or click below to browse</p>
                </div>
                <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-sm transition-all">
                  📁 Choose File
                </button>
              </div>
            </div>

            ${state.uploadMessage ? `
              <p class="text-center text-sm font-medium ${state.uploadMessage.startsWith('❌') ? 'text-red-500' : 'text-blue-600'}">
                ${state.uploadMessage}
              </p>
            ` : ''}
          </div>
        `;
      } else if (state.page === "admin") {
        // ADMIN DASHBOARD VIEW
        const logs = JSON.parse(localStorage.getItem('cv_download_logs') || '[]');
        const filteredLogs = logs.filter(log => 
          log.userName.toLowerCase().includes(state.adminSearch.toLowerCase()) ||
          log.userEmail.toLowerCase().includes(state.adminSearch.toLowerCase()) ||
          log.filename.toLowerCase().includes(state.adminSearch.toLowerCase())
        );

        const uniqueEmails = new Set(logs.map(l => l.userEmail).filter(e => e && e !== 'N/A')).size;

        app.innerHTML = `
          <div class="max-w-6xl mx-auto w-full space-y-6">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-3xl font-bold text-slate-900">Download Analytics</h2>
                <p class="text-slate-500 text-sm">Track users who have generated and downloaded CVs.</p>
              </div>
              <div class="flex gap-2">
                <button onclick="lockAdmin()" class="text-xs bg-slate-100 text-slate-700 hover:bg-slate-200 font-semibold px-4 py-2 rounded-xl border border-slate-300 transition-all">
                  🔒 Lock Admin
                </button>
                <button onclick="clearLogs()" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 font-semibold px-4 py-2 rounded-xl border border-red-200 transition-all">
                  🗑️ Clear Logs
                </button>
              </div>
            </div>

            <!-- KPI Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
                <p class="text-xs font-semibold uppercase text-slate-400">Total Downloads</p>
                <p class="text-3xl font-black text-blue-600 mt-2">${logs.length}</p>
              </div>
              <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
                <p class="text-xs font-semibold uppercase text-slate-400">Unique Emails Tracked</p>
                <p class="text-3xl font-black text-emerald-600 mt-2">${uniqueEmails}</p>
              </div>
              <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
                <p class="text-xs font-semibold uppercase text-slate-400">Latest Download</p>
                <p class="text-sm font-bold text-slate-700 mt-2">${logs[0]?.timestamp || 'No downloads yet'}</p>
              </div>
            </div>

            <!-- Logs Table Container -->
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
              <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <input 
                  type="text" 
                  placeholder="🔍 Search name, email, or filename..." 
                  value="${state.adminSearch}"
                  oninput="setState({ adminSearch: this.value })"
                  class="w-full md:w-80 border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                />
                <span class="text-xs text-slate-400 font-medium">${filteredLogs.length} Records</span>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                  <thead class="bg-slate-50 text-slate-700 text-xs uppercase font-semibold border-b border-slate-100">
                    <tr>
                      <th class="p-4">Timestamp</th>
                      <th class="p-4">User Name</th>
                      <th class="p-4">Email</th>
                      <th class="p-4">Filename</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${filteredLogs.length > 0 ? filteredLogs.map(log => `
                      <tr class="hover:bg-slate-50/80 transition-all">
                        <td class="p-4 text-xs font-medium text-slate-400 whitespace-nowrap">${log.timestamp}</td>
                        <td class="p-4 font-semibold text-slate-900 whitespace-nowrap">${log.userName}</td>
                        <td class="p-4 text-slate-600 whitespace-nowrap">${log.userEmail !== 'N/A' ? `📧 ${log.userEmail}` : '<span class="text-slate-300">N/A</span>'}</td>
                        <td class="p-4 text-xs font-mono text-slate-500 whitespace-nowrap">${log.filename}</td>
                      </tr>
                    `).join('') : `
                      <tr>
                        <td colspan="4" class="p-8 text-center text-slate-400 text-sm">No download records found.</td>
                      </tr>
                    `}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      } else if (state.page === "builder") {
        const d = state.data;
        const expList = d.experience || [];
        const eduList = d.education || [];
        const projList = d.projects || [];
