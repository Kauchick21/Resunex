<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Parser & Builder</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1f2937;
      --border: #e5e7eb;
      --error: #ef4444;
      --success: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .upload-zone:hover {
      border-color: var(--primary);
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .progress-bar-container {
      width: 100%;
      background-color: var(--border);
      height: 8px;
      border-radius: 4px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 24px;
      border-radius: 6px;
      color: white;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      display: none;
      z-index: 1000;
    }

    .toast.error { background-color: var(--error); }
    .toast.ok { background-color: var(--success); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .full-width { grid-column: span 2; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Resume Parser & Builder</h2>

    <!-- Upload View -->
    <div id="upload-view" class="card">
      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <h3>Click to upload resume</h3>
        <p>Supports PDF, DOCX, JPG, PNG, WEBP</p>
        <input type="file" id="file-input" onchange="handleFileSelect(event)" accept=".pdf,.docx,.jpg,.jpeg,.png,.webp" />
      </div>

      <div id="progress-container" class="hidden">
        <p id="progress-message" style="margin-top: 15px; font-weight: 500;"></p>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- Builder View -->
    <div id="builder-view" class="card hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3>Resume Data</h3>
        <button class="btn" onclick="resetApp()">Upload Another File</button>
      </div>

      <div class="grid">
        <div>
          <label>First Name</label>
          <input type="text" id="firstName" />
        </div>
        <div>
          <label>Last Name</label>
          <input type="text" id="lastName" />
        </div>
        <div>
          <label>Email</label>
          <input type="text" id="email" />
        </div>
        <div>
          <label>Phone</label>
          <input type="text" id="phone" />
        </div>
        <div>
          <label>LinkedIn</label>
          <input type="text" id="linkedin" />
        </div>
        <div>
          <label>GitHub</label>
          <input type="text" id="github" />
        </div>
        <div class="full-width">
          <label>Summary / Parsed Text</label>
          <textarea id="summary"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // --- Application State ---
    let state = {
      page: "upload", // "upload" | "builder"
      uploadProgress: null,
      uploadMessage: "",
      data: blankData()
    };

    function blankData() {
      return {
        personal: { firstName: "", lastName: "", email: "", phone: "", linkedin: "", github: "" },
        summary: "",
        education: [],
        experience: [],
        projects: [],
        skills: { technical: [], soft: [], certifications: [] }
      };
    }

    function setState(newState) {
      state = { ...state, ...newState };
      render();
    }

    function render() {
      const uploadView = document.getElementById("upload-view");
      const builderView = document.getElementById("builder-view");
      const progressContainer = document.getElementById("progress-container");
      const progressBar = document.getElementById("progress-bar");
      const progressMessage = document.getElementById("progress-message");

      if (state.page === "upload") {
        uploadView.classList.remove("hidden");
        builderView.classList.add("hidden");

        if (state.uploadProgress !== null) {
          progressContainer.classList.remove("hidden");
          progressBar.style.width = `${state.uploadProgress}%`;
          progressMessage.textContent = state.uploadMessage;
        } else {
          progressContainer.classList.add("hidden");
        }
      } else {
        uploadView.classList.add("hidden");
        builderView.classList.remove("hidden");

        // Populate builder inputs
        document.getElementById("firstName").value = state.data.personal?.firstName || "";
        document.getElementById("lastName").value = state.data.personal?.lastName || "";
        document.getElementById("email").value = state.data.personal?.email || "";
        document.getElementById("phone").value = state.data.personal?.phone || "";
        document.getElementById("linkedin").value = state.data.personal?.linkedin || "";
        document.getElementById("github").value = state.data.personal?.github || "";
        document.getElementById("summary").value = state.data.summary || "";
      }
    }

    function showToast(msg, type = "ok") {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = `toast ${type}`;
      toast.style.display = "block";
      setTimeout(() => {
        toast.style.display = "none";
      }, 4000);
    }

    function resetApp() {
      document.getElementById("file-input").value = "";
      setState({
        page: "upload",
        uploadProgress: null,
        uploadMessage: "",
        data: blankData()
      });
    }

    // --- Robust JSON Extractor & Repair ---
    function safeParseJSON(rawStr) {
      if (!rawStr || typeof rawStr !== "string") return null;

      let clean = rawStr.trim();

      // 1. Remove Markdown code blocks
      clean = clean.replace(/```(?:json)?/gi, "").replace(/```$/g, "").trim();

      // 2. Extract starting brace
      const firstBracket = clean.indexOf('{');
      if (firstBracket !== -1) {
        clean = clean.substring(firstBracket);
      }

      // 3. Auto-close truncated JSON if response was cut off by token limit
      let openBraces = 0;
      let openBrackets = 0;
      let insideStr = false;
      let escaped = false;

      for (let i = 0; i < clean.length; i++) {
        const c = clean[i];
        if (c === '\\' && !escaped) {
          escaped = true;
          continue;
        }
        if (c === '"' && !escaped) insideStr = !insideStr;
        if (!insideStr) {
          if (c === '{') openBraces++;
          if (c === '}') openBraces--;
          if (c === '[') openBrackets++;
          if (c === ']') openBrackets--;
        }
        escaped = false;
      }

      // Close unclosed strings and brackets
      if (insideStr) clean += '"';
      while (openBrackets > 0) { clean += ']'; openBrackets--; }
      while (openBraces > 0) { clean += '}'; openBraces--; }

      // 4. Clean control characters and trailing commas
      clean = clean
        .replace(/[\u0000-\u001F\u007F-\u009F]/g, " ")
        .replace(/,\s*([}\]])/g, '$1');

      try {
        return JSON.parse(clean);
      } catch (e1) {
        console.warn("Attempting lenient fallback parse...", e1);
        try {
          const escapedNewlines = clean.replace(/(?<=:\s*"[^"]*)\n(?=[^"]*")/g, "\\n");
          return JSON.parse(escapedNewlines);
        } catch (e2) {
          console.error("Parse failed completely.", e2);
          return null;
        }
      }
    }

    // --- File Handling & Parser Pipeline ---
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) handleFileUpload(file);
    }

    async function handleFileUpload(file) {
      if (!file) return;
      setState({ uploadProgress: 20, uploadMessage: "Extracting file content..." });

      const systemPrompt = `You are an API returning strictly structured JSON for resume data.
Format:
{
  "personal": { "firstName": "", "lastName": "", "email": "", "phone": "", "linkedin": "", "github": "" },
  "summary": "",
  "education": [{ "college": "", "degree": "", "spec": "", "from": "", "to": "" }],
  "experience": [{ "company": "", "title": "", "from": "", "to": "", "resp": "" }],
  "projects": [{ "name": "", "desc": "", "tech": "" }],
  "skills": { "technical": [], "soft": [], "certifications": [] }
}

RULES:
- Do NOT use unescaped double quotes inside values; use single quotes (') instead.
- Do NOT include markdown codeblocks or plain text outside the JSON object.
- Keep output concise to fit within token limits.`;

      let rawText = "";

      try {
        let jsonStr = "";
        const fileType = file.name.split('.').pop().toLowerCase();

        if (fileType === "pdf") {
          setState({ uploadProgress: 40, uploadMessage: "Reading PDF content..." });
          try {
            rawText = await extractPdfText(file);
            if (rawText && rawText.length > 50) {
              setState({ uploadProgress: 60, uploadMessage: "Analyzing text schema..." });
              jsonStr = await callLLMWithText(rawText, systemPrompt);
            } else {
              throw new Error("PDF text empty, switching to OCR...");
            }
          } catch (e) {
            setState({ uploadProgress: 50, uploadMessage: "Rendering scanned document..." });
            const base64Img = await pdfToBase64Image(file);
            setState({ uploadProgress: 75, uploadMessage: "Parsing visual details..." });
            jsonStr = await callLLMWithImage(base64Img, "image/jpeg", "Extract structured JSON from resume.", systemPrompt);
          }
        } else if (fileType === "docx") {
          setState({ uploadProgress: 50, uploadMessage: "Extracting Word document..." });
          rawText = await extractDocxText(file);
          setState({ uploadProgress: 75, uploadMessage: "Parsing layout..." });
          jsonStr = await callLLMWithText(rawText, systemPrompt);
        } else if (["jpg", "jpeg", "png", "webp"].includes(fileType)) {
          setState({ uploadProgress: 50, uploadMessage: "Encoding image..." });
          const base64 = await fileToBase64(file);
          const mime = file.type || `image/${fileType}`;
          setState({ uploadProgress: 75, uploadMessage: "Parsing image..." });
          jsonStr = await callLLMWithImage(base64, mime, "Extract structured JSON from resume.", systemPrompt);
        } else {
          throw new Error("Unsupported file format.");
        }

        setState({ uploadProgress: 90, uploadMessage: "Finalizing structure..." });

        const parsed = safeParseJSON(jsonStr);

        // Soft Fallback: Load builder with extracted text if schema parsing fails
        if (!parsed) {
          const fallbackData = blankData();
          fallbackData.summary = rawText || "Uploaded resume text parsed into builder. Please review your details.";
          setState({
            data: fallbackData,
            page: "builder",
            uploadProgress: null,
            uploadMessage: ""
          });
          showToast("Uploaded! Please review and fill in missing fields.", "ok");
          return;
        }

        setState({
          data: { ...blankData(), ...parsed },
          page: "builder",
          uploadProgress: null,
          uploadMessage: ""
        });
        showToast("Resume parsed successfully!", "ok");

      } catch (err) {
        console.error("Upload process error:", err);
        
        setState({
          data: blankData(),
          page: "builder",
          uploadProgress: null,
          uploadMessage: ""
        });
        showToast("Couldn't auto-read file structure. Blank template loaded.", "error");
      }
    }

    // --- Helper & Utility Hooks (Connect to your backend/libraries here) ---
    async function extractPdfText(file) {
      // Plug in pdf.js or backend endpoint here
      return await file.text();
    }

    async function extractDocxText(file) {
      // Plug in mammoth.js or backend endpoint here
      return await file.text();
    }

    async function pdfToBase64Image(file) {
      return await fileToBase64(file);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function callLLMWithText(text, systemPrompt) {
      // Replace with your API endpoint fetch call
      return new Promise((resolve) => setTimeout(() => {
        resolve(JSON.stringify({
          personal: { firstName: "John", lastName: "Doe", email: "john@example.com", phone: "+1 555-0199", linkedin: "linkedin.com/in/johndoe", github: "github.com/johndoe" },
          summary: "Experienced software engineer with a track record of building reliable web applications."
        }));
      }, 1000));
    }

    async function callLLMWithImage(base64, mime, prompt, systemPrompt) {
      // Replace with your multimodal API endpoint fetch call
      return callLLMWithText(base64, systemPrompt);
    }
  </script>
</body>
</html>
